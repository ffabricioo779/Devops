name: Changelog

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    # evita loop infinito: não roda se o commit veio do próprio bot
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gerar changelog a partir dos commits
        run: |
          {
            echo "# Changelog"
            echo ""
            echo "## Atualizado em $(date +'%d/%m/%Y')"
            echo ""
            git log --pretty=format:"- %s (%h) — %an, %ad" --date=short -n 30
            echo ""
          } > CHANGELOG.md

      - name: Commitar changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "chore(changelog): atualiza CHANGELOG.md [skip ci]"
          git push
